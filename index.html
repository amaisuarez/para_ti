<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¿Quieres saberlo?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F1E6D6;
    --bg-deep: #E7D5BE;
    --paper: #FBF6EE;
    --ink: #5B4235;
    --ink-soft: #8C7262;
    --rose: #C98E8A;
    --rose-deep: #B06F6B;
    --heart: #DDA9A2;
    --shadow: rgba(91, 66, 53, 0.16);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #3A2C24; --bg-deep: #2E221C; --paper: #4A3A30;
      --ink: #F3E6D3; --ink-soft: #CDB8A3; --rose: #D9A19C;
      --rose-deep: #E6B3AE; --heart: #8E5F5A; --shadow: rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #3A2C24; --bg-deep: #2E221C; --paper: #4A3A30;
    --ink: #F3E6D3; --ink-soft: #CDB8A3; --rose: #D9A19C;
    --rose-deep: #E6B3AE; --heart: #8E5F5A; --shadow: rgba(0,0,0,.35);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; min-height: 100%;
    background: radial-gradient(120% 80% at 50% 0%, var(--bg) 40%, var(--bg-deep) 100%);
    background-color: var(--bg);
    color: var(--ink);
    font-family: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  /* Floating hearts */
  .hearts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .hearts span {
    position: absolute; bottom: -40px; color: var(--heart); opacity: 0;
    animation: rise linear infinite;
  }
  @keyframes rise {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    10%  { opacity: .7; }
    90%  { opacity: .5; }
    100% { transform: translateY(-110vh) rotate(25deg); opacity: 0; }
  }

  main {
    position: relative; z-index: 1;
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 2rem 1.25rem; text-align: center;
  }

  /* Polaroid photo */
  .polaroid {
    background: var(--paper);
    padding: 12px 12px 44px;
    border-radius: 4px;
    box-shadow: 0 14px 34px var(--shadow);
    transform: rotate(-3deg);
    position: relative;
    width: min(72vw, 280px);
    margin-bottom: 2.25rem;
  }
  .polaroid::before {
    content: ""; position: absolute; top: -12px; left: 50%;
    width: 90px; height: 26px; transform: translateX(-50%) rotate(2deg);
    background: rgba(221, 169, 162, .55); border-radius: 2px;
  }
  .polaroid .photo {
    width: 100%; aspect-ratio: 1 / 1; border-radius: 2px; overflow: hidden;
    background: linear-gradient(135deg, var(--bg-deep), var(--heart));
    display: grid; place-items: center;
  }
  .polaroid .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .polaroid .photo .ph { color: var(--paper); font-size: 3.5rem; }
  .polaroid .stamp {
    position: absolute; right: -14px; bottom: -14px;
    width: 46px; height: 46px; border-radius: 50%;
    background: var(--rose); color: #fff; display: grid; place-items: center;
    font-size: 1.3rem; box-shadow: 0 6px 14px var(--shadow); transform: rotate(10deg);
  }

  h1 {
    font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    font-style: italic; font-weight: 500;
    font-size: clamp(2.6rem, 11vw, 4.2rem);
    line-height: 1.05; margin: 0 0 2rem; letter-spacing: -0.01em;
  }

  .choices { display: flex; gap: 1rem; align-items: center; justify-content: center; min-height: 64px; }
  button {
    font-family: inherit; font-weight: 700; font-size: 1.1rem;
    border: none; cursor: pointer; border-radius: 999px;
    padding: .85rem 2.2rem; transition: transform .25s ease, background .2s ease;
  }
  button:focus-visible { outline: 3px solid var(--rose-deep); outline-offset: 3px; }
  #yes {
    background: var(--rose); color: #fff;
    box-shadow: 0 8px 20px rgba(176, 111, 107, .35);
  }
  #yes:hover { background: var(--rose-deep); }
  #no {
    background: var(--paper); color: var(--ink-soft);
    box-shadow: 0 6px 16px var(--shadow);
    transition: left .35s cubic-bezier(.3,1.4,.5,1), top .35s cubic-bezier(.3,1.4,.5,1), transform .25s ease;
    white-space: nowrap; z-index: 5;
  }
  #no.loose { position: fixed; }

  /* Countdown */
  #reveal { display: none; flex-direction: column; align-items: center; animation: appear .7s ease both; }
  #reveal.show { display: flex; }
  @keyframes appear { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
  .lead {
    font-family: "Cormorant Garamond", Georgia, serif; font-style: italic;
    font-size: clamp(1.6rem, 6vw, 2.2rem); margin: 0 0 1.6rem; line-height: 1.2;
  }
  .clock { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .6rem; width: min(92vw, 460px); }
  .unit {
    background: var(--paper); border-radius: 18px; padding: 1rem .25rem .8rem;
    box-shadow: 0 10px 24px var(--shadow);
  }
  .unit b {
    display: block; font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600;
    font-size: clamp(2.2rem, 10vw, 3.4rem); line-height: 1; font-variant-numeric: tabular-nums;
    color: var(--rose-deep);
  }
  .unit small { display: block; margin-top: .4rem; color: var(--ink-soft); font-size: .85rem; }
  .foot { margin: 1.8rem 0 0; color: var(--ink-soft); font-size: 1rem; }

  .burst { position: fixed; pointer-events: none; z-index: 10; color: var(--rose); animation: pop 1.2s ease-out forwards; }
  @keyframes pop {
    0% { transform: translate(0,0) scale(.4); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1.1); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .hearts { display: none; }
    #no { transition: none; }
    #reveal { animation: none; }
  }
</style>
</head>

      <span class="stamp" aria-hidden="true">♥</span>
    </figure>

    <section id="ask">
      <h1>¿Quieres saberlo?</h1>
      <div class="choices">
        <button id="yes" type="button">Sí</button>
        <button id="no" type="button">No</button>
      </div>
    </section>

    <section id="reveal" aria-live="polite">
      <p class="lead" id="leadText">Pues tendrás que esperar un poquito…</p>
      <div class="clock">
        <div class="unit"><b id="d">00</b><small>días</small></div>
        <div class="unit"><b id="h">00</b><small>horas</small></div>
        <div class="unit"><b id="m">00</b><small>minutos</small></div>
        <div class="unit"><b id="s">00</b><small>segundos</small></div>
      </div>
    </section>
  </main>

<script>
  // Floating hearts
  (function () {
    const box = document.getElementById('hearts');
    for (let i = 0; i < 18; i++) {
      const s = document.createElement('span');
      s.textContent = '♥';
      s.style.left = Math.random() * 100 + 'vw';
      s.style.fontSize = (12 + Math.random() * 20) + 'px';
      s.style.animationDuration = (9 + Math.random() * 10) + 's';
      s.style.animationDelay = (Math.random() * 12) + 's';
      box.appendChild(s);
    }
  })();

  const yes = document.getElementById('yes');
  const no = document.getElementById('no');
  const phrases = ['No', '¿Seguro?', 'Piénsalo bien', 'Venga ya…', 'Que no te escapas', 'Dale al sí', 'Ni lo intentes', '♡ sí ♡'];
  let tries = 0;

  function moveNo(e) {
    if (e) e.preventDefault();
    tries++;
    const r = no.getBoundingClientRect();
    if (!no.classList.contains('loose')) {
      no.style.left = r.left + 'px';
      no.style.top = r.top + 'px';
      no.classList.add('loose');
      void no.offsetWidth;
    }
    no.textContent = phrases[Math.min(tries, phrases.length - 1)];
    const w = no.offsetWidth, h = no.offsetHeight, pad = 16;
    const maxX = window.innerWidth - w - pad;
    const maxY = window.innerHeight - h - pad;
    let x, y, guard = 0;
    const yr = yes.getBoundingClientRect();
    do {
      x = pad + Math.random() * Math.max(1, maxX - pad);
      y = pad + Math.random() * Math.max(1, maxY - pad);
      guard++;
    } while (guard < 20 && x < yr.right + 10 && x + w > yr.left - 10 && y < yr.bottom + 10 && y + h > yr.top - 10);
    no.style.left = x + 'px';
    no.style.top = y + 'px';
    no.style.transform = 'rotate(' + (Math.random() * 16 - 8) + 'deg)';
    yes.style.transform = 'scale(' + Math.min(1 + tries * 0.08, 1.6) + ')';
  }
  no.addEventListener('click', moveNo);
  no.addEventListener('touchstart', moveNo, { passive: false });

  // Countdown to 3 Oct 2026, 00:00 (local time)
  const target = new Date(2026, 9, 3, 0, 0, 0).getTime();
  const pad2 = n => String(n).padStart(2, '0');
  let timer;
  function tick() {
    const diff = target - Date.now();
    if (diff <= 0) {
      ['d','h','m','s'].forEach(id => document.getElementById(id).textContent = '00');
      document.getElementById('leadText').textContent = '¡Ya es el día!';
      clearInterval(timer);
      return;
    }
    const sec = Math.floor(diff / 1000);
    document.getElementById('d').textContent = pad2(Math.floor(sec / 86400));
    document.getElementById('h').textContent = pad2(Math.floor(sec % 86400 / 3600));
    document.getElementById('m').textContent = pad2(Math.floor(sec % 3600 / 60));
    document.getElementById('s').textContent = pad2(sec % 60);
  }

  function burst(x, y) {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    for (let i = 0; i < 16; i++) {
      const b = document.createElement('span');
      b.className = 'burst';
      b.textContent = '♥';
      b.style.left = x + 'px'; b.style.top = y + 'px';
      b.style.fontSize = (14 + Math.random() * 16) + 'px';
      const a = Math.random() * Math.PI * 2, d = 80 + Math.random() * 120;
      b.style.setProperty('--dx', Math.cos(a) * d + 'px');
      b.style.setProperty('--dy', Math.sin(a) * d + 'px');
      document.body.appendChild(b);
      setTimeout(() => b.remove(), 1300);
    }
  }

  yes.addEventListener('click', () => {
    const r = yes.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2);
    document.getElementById('ask').style.display = 'none';
    no.style.display = 'none';
    document.getElementById('reveal').classList.add('show');
    tick();
    timer = setInterval(tick, 1000);
  });
</script>
</body>
</html>
